<main class="page form-page">
  <div class="form-box">
    <div class="form-title">COBRA</div>
    <p class="form-hint">Bienvenue, aventurier</p>

    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="Ton nom de héros…" autocomplete="username"/>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn-submit" onclick="handleLogin()">Se connecter</button>

    <p class="form-foot">
      Pas encore de compte ? <a href="signup.html">Créer un compte</a>
    </p>
  </div>
</main>
